<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veerakumar V | Meet the Developer | POWERNEX 26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top Navigation Header */
    .dev-nav-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      pointer-events: auto;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      text-decoration: none;
      font-family: 'Geist Mono', monospace;
      font-size: 0.82rem;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }

    .back-home-link:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Solid Action Button */
    .flip-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: #eab308;
      color: #000000;
      border: 1px solid #facc15;
      border-radius: 9999px;
      font-family: 'Geist Mono', monospace;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      transition: background 0.2s ease, transform 0.15s ease;
      touch-action: manipulation;
    }

    .flip-btn:hover {
      background: #facc15;
      transform: translateY(-1px);
    }

    .flip-btn:active {
      transform: translateY(1px);
    }

    .flip-btn-icon {
      transition: transform 0.5s ease;
    }

    .portal-tag {
      font-family: 'Geist Mono', monospace;
      font-size: 0.75rem;
      color: #cbd5e1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 7px 12px;
      border-radius: 9999px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #eab308;
    }

    /* Mobile Header Layout */
    @media (max-width: 640px) {
      .dev-nav-header {
        padding: 10px 12px;
      }
      .back-home-link {
        padding: 6px 12px;
        font-size: 0.74rem;
        gap: 5px;
      }
      .header-actions {
        gap: 6px;
      }
      .flip-btn {
        padding: 6px 14px;
        font-size: 0.72rem;
        gap: 5px;
      }
      .portal-tag {
        padding: 6px 10px;
        font-size: 0.68rem;
      }
      .portal-tag-label-full {
        display: none;
      }
      .portal-tag-label-short {
        display: inline;
      }
    }

    @media (min-width: 641px) {
      .portal-tag-label-full {
        display: inline;
      }
      .portal-tag-label-short {
        display: none;
      }
    }

    /* 3D WebGL Canvas */
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 10;
      touch-action: none;
      cursor: grab;
    }

    #webgl-canvas.grabbing {
      cursor: grabbing !important;
    }

    #webgl-canvas.link-hover {
      cursor: pointer !important;
    }

    .interaction-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
      font-family: 'Geist Mono', monospace;
      font-size: 0.68rem;
      color: rgba(148, 163, 184, 0.4);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="dev-nav-header">
    <a href="index.html" class="back-home-link">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>POWERNEX 26</span>
    </a>

    <div class="header-actions">
      <button class="flip-btn" id="card-flip-toggle-btn" type="button" aria-label="Flip ID Card">
        <i data-lucide="rotate-cw" class="flip-btn-icon" style="width: 13px; height: 13px;"></i>
        <span id="flip-btn-text">FLIP CARD</span>
      </button>

      <div class="portal-tag">
        <span class="pulse-dot"></span>
        <span class="portal-tag-label-full">MEET THE DEVELOPER</span>
        <span class="portal-tag-label-short">DEVELOPER</span>
      </div>
    </div>
  </header>

  <!-- 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <div class="interaction-hint">
    <span>Drag to swing &bull; Click to flip</span>
  </div>

  <script>
    if (window.lucide) {
      window.lucide.createIcons();
    }

    // =========================================================================
    // HD HIGH-PERFORMANCE 3D ID CARD & LANYARD VIEWER
    // =========================================================================
    (function initHDDeveloperLanyard() {
      const canvas = document.getElementById('webgl-canvas');
      if (!canvas) return;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      // Studio lighting setup
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.1);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
      keyLight.position.set(3, 5, 5);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xe2e8f0, 0.7);
      fillLight.position.set(-3, -1, 4);
      scene.add(fillLight);

      const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
      backLight.position.set(0, 4, -3);
      scene.add(backLight);

      const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);

      const isMobile = window.innerWidth <= 768;
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.25) : Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const maxAniso = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 8;

      // Card Dimensions
      const CARD_WIDTH = 2.4;
      const CARD_HEIGHT = 3.65;
      const CARD_THICKNESS = 0.04;

      // -----------------------------------------------------------------------
      // 1. HIGH RESOLUTION REALISTIC LANYARD STRAP TEXTURE (512 x 2048)
      // -----------------------------------------------------------------------
      function createHDStrapTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 2048;
        const ctx = c.getContext('2d');

        // Deep rich matte black fabric base
        ctx.fillStyle = '#0c0c0f';
        ctx.fillRect(0, 0, 512, 2048);

        // Fabric micro-grain
        ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';
        for (let y = 0; y < 2048; y += 4) {
          ctx.fillRect(0, y, 512, 1.5);
        }

        // Ribbed edge borders
        ctx.strokeStyle = '#222228';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(16, 0); ctx.lineTo(16, 2048);
        ctx.moveTo(496, 0); ctx.lineTo(496, 2048);
        ctx.stroke();

        ctx.strokeStyle = '#18181f';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(28, 0); ctx.lineTo(28, 2048);
        ctx.moveTo(484, 0); ctx.lineTo(484, 2048);
        ctx.stroke();

        // 3 Crisp White Atom Emblems
        function drawHDAtomEmblem(y) {
          ctx.save();
          ctx.translate(256, y);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 14;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // Central Nucleus
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 18, 0, Math.PI * 2);
          ctx.fill();

          // 3 Intersecting Orbital Rings
          const orbitAngles = [0, Math.PI / 3, (2 * Math.PI) / 3];
          orbitAngles.forEach(ang => {
            ctx.beginPath();
            ctx.ellipse(0, 0, 110, 42, ang, 0, Math.PI * 2);
            ctx.stroke();
          });

          ctx.restore();
        }

        drawHDAtomEmblem(340);
        drawHDAtomEmblem(1024);
        drawHDAtomEmblem(1708);

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.ClampToEdgeWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.generateMipmaps = true;
        tex.anisotropy = maxAniso;
        return tex;
      }

      // -----------------------------------------------------------------------
      // 2. ULTRA-HD FRONT CARD TEXTURE (2048 x 3072) - USING me.png
      // -----------------------------------------------------------------------
                        // -----------------------------------------------------------------------
      // 1. STANDARD NON-GLOWING ICON DRAWING UTILITIES
      // Clean, professional, flat, normal brand styling (Zero glow/neon)
      // -----------------------------------------------------------------------
      
      // Instagram Official Icon
      function drawInstagramIcon(ctx, cx, cy, r) {
        ctx.save();
        // Base dark circle
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = '#181820';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Instagram camera outline
        const sz = r * 0.48;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.roundRect(cx - sz, cy - sz, sz * 2, sz * 2, 14);
        ctx.stroke();

        // Inner lens
        ctx.beginPath();
        ctx.arc(cx, cy, sz * 0.48, 0, Math.PI * 2);
        ctx.stroke();

        // Top-right flash dot
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx + sz * 0.52, cy - sz * 0.52, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // LinkedIn Official Icon
      function drawLinkedInIcon(ctx, cx, cy, r) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = '#0a66c2';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // White 'in' symbol
        ctx.fillStyle = '#ffffff';
        // Dot for 'i'
        ctx.beginPath();
        ctx.arc(cx - 24, cy - 20, 5, 0, Math.PI * 2);
        ctx.fill();
        // Stem for 'i'
        ctx.fillRect(cx - 28, cy - 8, 8, 32);

        // 'n'
        ctx.fillRect(cx - 10, cy - 8, 8, 32);
        ctx.beginPath();
        ctx.arc(cx + 8, cy + 2, 15, Math.PI, 0, false);
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.fillRect(cx + 19, cy + 2, 8, 22);
        ctx.restore();
      }

      // GitHub Official Icon
      function drawGitHubIcon(ctx, cx, cy, r) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = '#24292e';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Octocat vector silhouette
        const p = new Path2D('M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z');
        ctx.translate(cx - 36, cy - 36);
        ctx.scale(3.0, 3.0);
        ctx.fillStyle = '#ffffff';
        ctx.fill(p);
        ctx.restore();
      }

      // Email / Mail Official Icon
      function drawEmailIcon(ctx, cx, cy, r) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = '#1e2028';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // White envelope outline and flap
        const ew = 38;
        const eh = 26;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.roundRect(cx - ew, cy - eh, ew * 2, eh * 2, 6);
        ctx.stroke();

        // Flap
        ctx.beginPath();
        ctx.moveTo(cx - ew, cy - eh);
        ctx.lineTo(cx, cy + 2);
        ctx.lineTo(cx + ew, cy - eh);
        ctx.stroke();
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 2. ULTRA-HD FRONT CARD TEXTURE (2048 x 3072) - LARGE TYPOGRAPHY
      // -----------------------------------------------------------------------
      const frontCanvas = document.createElement('canvas');
      frontCanvas.width = isMobile ? 1024 : 2048;
      frontCanvas.height = isMobile ? 1536 : 3072;
      const frontCtx = frontCanvas.getContext('2d');
      if (isMobile) frontCtx.scale(0.5, 0.5);

      const frontTexture = new THREE.CanvasTexture(frontCanvas);
      frontTexture.generateMipmaps = false;
      frontTexture.minFilter = THREE.LinearFilter;
      frontTexture.magFilter = THREE.LinearFilter;
      frontTexture.anisotropy = maxAniso;

      let meImg = new Image();
      meImg.src = 'me.png';
      meImg.onload = () => {
        renderFrontFaceHD();
        frontTexture.needsUpdate = true;
      };

      function renderFrontFaceHD() {
        const w = 2048;
        const h = 3072;
        frontCtx.clearRect(0, 0, w, h);

        // Solid Matte Pitch Black Card Base
        frontCtx.fillStyle = '#08080a';
        frontCtx.fillRect(0, 0, w, h);

        const bgGrad = frontCtx.createLinearGradient(0, 0, w, h);
        bgGrad.addColorStop(0, '#0f0f13');
        bgGrad.addColorStop(0.45, '#070709');
        bgGrad.addColorStop(1, '#030305');
        frontCtx.fillStyle = bgGrad;
        frontCtx.fillRect(0, 0, w, h);

        // Refined Clean Gold Card Border (Non-glowing, zero blur)
        frontCtx.save();
        frontCtx.strokeStyle = 'rgba(212, 175, 55, 0.42)';
        frontCtx.lineWidth = 8;
        frontCtx.beginPath();
        frontCtx.roundRect(14, 14, w - 28, h - 28, 28);
        frontCtx.stroke();
        frontCtx.restore();

        // Metallic Punch Hole Grommet Rim at top (for lanyard hook)
        frontCtx.save();
        frontCtx.strokeStyle = '#475569';
        frontCtx.lineWidth = 14;
        frontCtx.beginPath();
        frontCtx.arc(w / 2, 130, 56, 0, Math.PI * 2);
        frontCtx.stroke();

        frontCtx.fillStyle = '#000000';
        frontCtx.beginPath();
        frontCtx.arc(w / 2, 130, 48, 0, Math.PI * 2);
        frontCtx.fill();
        frontCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        frontCtx.lineWidth = 4;
        frontCtx.stroke();
        frontCtx.restore();

        // PHOTO: me.png (Preserving exact 1086x1448 native 3:4 aspect ratio, zero distortion)
        const photoW = 900;
        const photoH = 1200; // Exactly 3:4 aspect ratio matching native 1086:1448
        const photoX = (w - photoW) / 2; // 574
        const photoY = 270;
        const photoRadius = 24;

        frontCtx.save();
        frontCtx.beginPath();
        frontCtx.roundRect(photoX, photoY, photoW, photoH, photoRadius);
        frontCtx.clip();

        if (meImg.complete && meImg.naturalWidth > 0) {
          frontCtx.imageSmoothingEnabled = true;
          frontCtx.imageSmoothingQuality = 'high';
          frontCtx.drawImage(
            meImg,
            0, 0, meImg.naturalWidth, meImg.naturalHeight,
            photoX, photoY, photoW, photoH
          );
        } else {
          frontCtx.fillStyle = '#1e1e24';
          frontCtx.fillRect(photoX, photoY, photoW, photoH);
        }
        frontCtx.restore();

        // Clean Solid Gold Photo Frame Border (Flat, zero glow)
        frontCtx.save();
        frontCtx.strokeStyle = '#d4af37';
        frontCtx.lineWidth = 6;
        frontCtx.beginPath();
        frontCtx.roundRect(photoX, photoY, photoW, photoH, photoRadius);
        frontCtx.stroke();
        frontCtx.restore();

        // 1. DEVELOPER NAME: VEERAKUMAR V (Substantially Larger, Bold, Highly Prominent)
        frontCtx.save();
        frontCtx.fillStyle = '#ffffff';
        frontCtx.font = 'bold 136px Inter, sans-serif';
        frontCtx.textAlign = 'center';
        frontCtx.letterSpacing = '1px';
        frontCtx.fillText('VEERAKUMAR V', w / 2, 1630);
        frontCtx.restore();

        // 2. ROLE: Web Developer & EEE Student (Noticeably Larger)
        frontCtx.save();
        frontCtx.fillStyle = '#fbbf24';
        frontCtx.font = 'bold 74px Inter, sans-serif';
        frontCtx.textAlign = 'center';
        frontCtx.fillText('Web Developer & EEE Student', w / 2, 1745);
        frontCtx.restore();

        // 3. ACADEMIC YEAR: 2nd Year (Larger, naturally placed near role)
        frontCtx.save();
        const yearText = '2nd Year';
        frontCtx.font = 'bold 54px "Geist Mono", monospace';
        const yearMetrics = frontCtx.measureText(yearText);
        const yearW = yearMetrics.width + 64;
        const yearH = 80;
        const yearX = (w - yearW) / 2;
        const yearY = 1815;

        frontCtx.fillStyle = 'rgba(212, 175, 55, 0.12)';
        frontCtx.strokeStyle = 'rgba(212, 175, 55, 0.45)';
        frontCtx.lineWidth = 3;
        frontCtx.beginPath();
        frontCtx.roundRect(yearX, yearY, yearW, yearH, yearH / 2);
        frontCtx.fill();
        frontCtx.stroke();

        frontCtx.fillStyle = '#fde047';
        frontCtx.textAlign = 'center';
        frontCtx.fillText(yearText, w / 2, yearY + 56);
        frontCtx.restore();

        // 4. DEPARTMENT & COLLEGE (Noticeably Larger with Gold Graduation Cap Icon)
        const capX = 200;
        const capY = 2085;
        const capSize = 54;

        frontCtx.save();
        frontCtx.strokeStyle = '#d4af37';
        frontCtx.fillStyle = '#d4af37';
        frontCtx.lineWidth = 6;
        frontCtx.lineCap = 'round';
        frontCtx.lineJoin = 'round';
        // Diamond cap
        frontCtx.beginPath();
        frontCtx.moveTo(capX, capY - capSize * 0.5);
        frontCtx.lineTo(capX + capSize, capY);
        frontCtx.lineTo(capX, capY + capSize * 0.5);
        frontCtx.lineTo(capX - capSize, capY);
        frontCtx.closePath();
        frontCtx.stroke();
        // Skull cap arc
        frontCtx.beginPath();
        frontCtx.arc(capX, capY + capSize * 0.2, capSize * 0.65, 0.2 * Math.PI, 0.8 * Math.PI);
        frontCtx.stroke();
        // Tassel
        frontCtx.beginPath();
        frontCtx.moveTo(capX + capSize * 0.7, capY + capSize * 0.15);
        frontCtx.lineTo(capX + capSize * 0.9, capY + capSize * 0.85);
        frontCtx.stroke();
        frontCtx.restore();

        // Department & College Text (Large, High-Contrast Typography)
        frontCtx.save();
        frontCtx.textAlign = 'left';
        frontCtx.fillStyle = '#f8fafc';
        frontCtx.font = 'bold 64px Inter, sans-serif';
        frontCtx.fillText('Department of Electrical & Electronics Engineering', 290, 2060);

        frontCtx.fillStyle = '#cbd5e1';
        frontCtx.font = '600 58px Inter, sans-serif';
        frontCtx.fillText('University College of Engineering, Ariyalur', 290, 2145);
        frontCtx.restore();

        // Subtle Gold Separator Line
        frontCtx.save();
        frontCtx.strokeStyle = 'rgba(212, 175, 55, 0.25)';
        frontCtx.lineWidth = 3;
        frontCtx.beginPath();
        frontCtx.moveTo(160, 2260);
        frontCtx.lineTo(w - 160, 2260);
        frontCtx.stroke();
        frontCtx.restore();

        // 5. FOUR NORMAL CONTACT / SOCIAL ICONS IN ONE ROW (Instagram | LinkedIn | GitHub | Email)
        const socialY = 2430;
        const iconRadius = 78;
        const socials = [
          { name: 'Instagram', draw: drawInstagramIcon, x: 400 },
          { name: 'LinkedIn', draw: drawLinkedInIcon, x: 816 },
          { name: 'GitHub', draw: drawGitHubIcon, x: 1232 },
          { name: 'Email', draw: drawEmailIcon, x: 1648 }
        ];

        socials.forEach(s => {
          s.draw(frontCtx, s.x, socialY, iconRadius);

          // Sub-label under each icon
          frontCtx.save();
          frontCtx.fillStyle = '#cbd5e1';
          frontCtx.font = '600 44px Inter, sans-serif';
          frontCtx.textAlign = 'center';
          frontCtx.fillText(s.name, s.x, socialY + iconRadius + 65);
          frontCtx.restore();
        });

        // 6. CONTACT ME TEXT LABEL UNDERNEATH
        frontCtx.save();
        frontCtx.fillStyle = '#fbbf24';
        frontCtx.font = 'bold 52px "Geist Mono", monospace';
        frontCtx.textAlign = 'center';
        frontCtx.letterSpacing = '5px';
        frontCtx.fillText('CONTACT ME', w / 2, 2710);
        frontCtx.restore();
      }

      renderFrontFaceHD();

      // -----------------------------------------------------------------------

      function setupRopeNodes() {

      const uvs = new Float32Array(vertexCount * 2);
      const indices = [];

      for (let i = 0; i < ROPE_SEGMENTS; i++) {
        const a = i * 2;
        const b = i * 2 + 1;
        const c = (i + 1) * 2;
        const d = (i + 1) * 2 + 1;
        indices.push(a, b, c);
        indices.push(b, d, c);
      }

      ribbonGeo.setIndex(indices);
      ribbonGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      ribbonGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

      for (let i = 0; i <= ROPE_SEGMENTS; i++) {
        const v = 1.0 - (i / ROPE_SEGMENTS);
        uvs[i * 4 + 0] = 0.0;
        uvs[i * 4 + 1] = v;
        uvs[i * 4 + 2] = 1.0;
        uvs[i * 4 + 3] = v;

      function updateRibbonGeometry() {
        const posAttr = ribbonGeo.attributes.position;
        const halfW = RIBBON_WIDTH / 2;

        for (let i = 0; i <= ROPE_SEGMENTS; i++) {
          const pt = ropePoints[i];
          let tangent = new THREE.Vector3(0, -1, 0);
          if (i < ROPE_SEGMENTS) {
            tangent.subVectors(ropePoints[i + 1], pt).normalize();
          } else {
            tangent.subVectors(pt, ropePoints[i - 1]).normalize();
          }

          const lateral = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 0, 1)).normalize().multiplyScalar(halfW);
          if (lateral.lengthSq() < 0.0001) lateral.set(halfW, 0, 0);

          posAttr.setXYZ(i * 2 + 0, pt.x - lateral.x, pt.y - lateral.y, pt.z - lateral.z);
          posAttr.setXYZ(i * 2 + 1, pt.x + lateral.x, pt.y + lateral.y, pt.z + lateral.z);
        }
        posAttr.needsUpdate = true;
        ribbonGeo.computeVertexNormals();

        return null;

      canvas.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button') || e.target.closest('a')) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        dragStartPos = { x: e.clientX, y: e.clientY };

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(cardMesh);
        if (intersects.length > 0) {
          isDragging = true;
          canvas.classList.add('grabbing');
          if (canvas.setPointerCapture) {
            canvas.setPointerCapture(e.pointerId);
          }
          dragPlane.setFromNormalAndCoplanarPoint(
            camera.getWorldDirection(new THREE.Vector3()).negate(),

      });

      canvas.addEventListener('pointermove', (e) => {

        if (isDragging) {
          raycaster.setFromCamera(mouse, camera);
          if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
            const endNode = ropePoints[ROPE_SEGMENTS];
            endNode.x += (planeIntersect.x - endNode.x) * 0.35;
            endNode.y += (planeIntersect.y - endNode.y) * 0.35;
            endNode.z += (planeIntersect.z - endNode.z) * 0.35;

        const width = window.innerWidth;

        if (aspect < 0.72) {
          camera.fov = 37;
          camera.position.set(0, -0.65, 8.4);
        } else if (aspect < 1.0) {
          camera.fov = 35;
          camera.position.set(0, -0.45, 8.5);

          const oldP = oldRopePoints[i];
          const vx = (p.x - oldP.x) * 0.96;
          const vy = (p.y - oldP.y) * 0.96;
          const vz = (p.z - oldP.z) * 0.96;

          oldP.copy(p);

          p.x += vx + gravity.x;
          p.y += vy + gravity.y;
          p.z += vz + gravity.z;
        }

        ropePoints[0].copy(ROPE_TOP);

        const physicsPasses = isMobile ? 4 : 7;
        for (let pass = 0; pass < physicsPasses; pass++) {
          for (let i = 0; i < ROPE_SEGMENTS; i++) {
            const p1 = ropePoints[i];
            const p2 = ropePoints[i + 1];

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dz = p2.z - p1.z;
            const dist = Math.hypot(dx, dy, dz) || 0.001;
            const diff = (dist - segmentLen) / dist;

            if (i === 0) {
              p2.x -= dx * diff;
              p2.y -= dy * diff;
              p2.z -= dz * diff;
            } else if (i + 1 === ROPE_SEGMENTS && isDragging) {
              p1.x += dx * diff;
              p1.y += dy * diff;
              p1.z += dz * diff;
            } else {
              p1.x += dx * diff * 0.5;
              p1.y += dy * diff * 0.5;
              p1.z += dz * diff * 0.5;
              p2.x -= dx * diff * 0.5;
              p2.y -= dy * diff * 0.5;
              p2.z -= dz * diff * 0.5;
            }
          }
        }

        updateRibbonGeometry();

        const ropeTip = ropePoints[ROPE_SEGMENTS];
        const ropePreTip = ropePoints[ROPE_SEGMENTS - 1];
        cardPivot.position.copy(ropeTip);

        const ropeDir = new THREE.Vector3().subVectors(ropeTip, ropePreTip).normalize();
        const targetRotZ = THREE.MathUtils.clamp(-ropeDir.x * 0.65, -0.5, 0.5);
        const targetRotX = THREE.MathUtils.clamp(ropeDir.z * 0.65, -0.4, 0.4);

        cardPivot.rotation.z += (targetRotZ - cardPivot.rotation.z) * 0.08;
        cardPivot.rotation.x += (targetRotX - cardPivot.rotation.x) * 0.08;

        currentRotationY += (targetRotationY - currentRotationY) * 0.045;
        cardMesh.rotation.y = currentRotationY;

        renderer.render(scene, camera);
      }

      animate();
    })();
  </script>
