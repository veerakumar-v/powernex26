<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veerakumar V | Meet the Developer | POWERNEX 26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top Navigation Header */
    .dev-nav-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      pointer-events: auto;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      text-decoration: none;
      font-family: 'Geist Mono', monospace;
      font-size: 0.82rem;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }

    .back-home-link:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Solid Action Button */
    .flip-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: #eab308;
      color: #000000;
      border: 1px solid #facc15;
      border-radius: 9999px;
      font-family: 'Geist Mono', monospace;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      transition: background 0.2s ease, transform 0.15s ease;
      touch-action: manipulation;
    }

    .flip-btn:hover {
      background: #facc15;
      transform: translateY(-1px);
    }

    .flip-btn:active {
      transform: translateY(1px);
    }

    .flip-btn-icon {
      transition: transform 0.5s ease;
    }

    .portal-tag {
      font-family: 'Geist Mono', monospace;
      font-size: 0.75rem;
      color: #cbd5e1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 7px 12px;
      border-radius: 9999px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    /* Mobile Header Layout */
    @media (max-width: 640px) {
      .dev-nav-header {
        padding: 10px 12px;
      }
      .back-home-link {
        padding: 6px 12px;
        font-size: 0.74rem;
        gap: 5px;
      }
      .header-actions {
        gap: 6px;
      }
      .flip-btn {
        padding: 6px 14px;
        font-size: 0.72rem;
        gap: 5px;
      }
      .portal-tag {
        padding: 6px 10px;
        font-size: 0.68rem;
      }
      .portal-tag-label-full {
        display: none;
      }
      .portal-tag-label-short {
        display: inline;
      }
    }

    @media (min-width: 641px) {
      .portal-tag-label-full {
        display: inline;
      }
      .portal-tag-label-short {
        display: none;
      }
    }

    /* 3D WebGL Canvas */
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 10;
      touch-action: none;
      cursor: grab;
    }

    #webgl-canvas.grabbing {
      cursor: grabbing !important;
    }

    #webgl-canvas.link-hover {
      cursor: pointer !important;
    }

    .interaction-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
      font-family: 'Geist Mono', monospace;
      font-size: 0.68rem;
      color: rgba(148, 163, 184, 0.4);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="dev-nav-header">
    <a href="index.html" class="back-home-link">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>POWERNEX 26</span>
    </a>

    <div class="header-actions">
      <button class="flip-btn" id="card-flip-toggle-btn" type="button" aria-label="Flip ID Card">
        <i data-lucide="rotate-cw" class="flip-btn-icon" style="width: 13px; height: 13px;"></i>
        <span id="flip-btn-text">FLIP CARD</span>
      </button>

      <div class="portal-tag">
        <span class="pulse-dot"></span>
        <span class="portal-tag-label-full">MEET THE DEVELOPER</span>
        <span class="portal-tag-label-short">DEVELOPER</span>
      </div>
    </div>
  </header>

  <!-- 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <div class="interaction-hint">
    <span>Drag to swing &bull; Click to flip</span>
  </div>

  <script>
    if (window.lucide) {
      window.lucide.createIcons();
    }

    // =========================================================================
    // HD HIGH-PERFORMANCE 3D ID CARD & LANYARD VIEWER
    // =========================================================================
    (function initHDDeveloperLanyard() {
      const canvas = document.getElementById('webgl-canvas');
      if (!canvas) return;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      // Studio lighting setup
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.1);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
      keyLight.position.set(3, 5, 5);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xe2e8f0, 0.7);
      fillLight.position.set(-3, -1, 4);
      scene.add(fillLight);

      const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
      backLight.position.set(0, 4, -3);
      scene.add(backLight);

      const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);

      const isMobile = window.innerWidth <= 768;
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.25) : Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const maxAniso = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 8;

      // Card Dimensions
      const CARD_WIDTH = 2.4;
      const CARD_HEIGHT = 3.65;
      const CARD_THICKNESS = 0.04;

      // -----------------------------------------------------------------------
      // 1. HIGH RESOLUTION REALISTIC LANYARD STRAP TEXTURE (512 x 2048)
      // -----------------------------------------------------------------------
      function createHDStrapTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 2048;
        const ctx = c.getContext('2d');

        // Deep rich matte black fabric base
        ctx.fillStyle = '#0c0c0f';
        ctx.fillRect(0, 0, 512, 2048);

        // Fabric micro-grain
        ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';
        for (let y = 0; y < 2048; y += 4) {
          ctx.fillRect(0, y, 512, 1.5);
        }

        // Ribbed edge borders
        ctx.strokeStyle = '#222228';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(16, 0); ctx.lineTo(16, 2048);
        ctx.moveTo(496, 0); ctx.lineTo(496, 2048);
        ctx.stroke();

        ctx.strokeStyle = '#18181f';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(28, 0); ctx.lineTo(28, 2048);
        ctx.moveTo(484, 0); ctx.lineTo(484, 2048);
        ctx.stroke();

        // 3 Crisp White Atom Emblems
        function drawHDAtomEmblem(y) {
          ctx.save();
          ctx.translate(256, y);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 14;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // Central Nucleus
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 18, 0, Math.PI * 2);
          ctx.fill();

          // 3 Intersecting Orbital Rings
          const orbitAngles = [0, Math.PI / 3, (2 * Math.PI) / 3];
          orbitAngles.forEach(ang => {
            ctx.beginPath();
            ctx.ellipse(0, 0, 110, 42, ang, 0, Math.PI * 2);
            ctx.stroke();
          });

          ctx.restore();
        }

        drawHDAtomEmblem(340);
        drawHDAtomEmblem(1024);
        drawHDAtomEmblem(1708);

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.ClampToEdgeWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.generateMipmaps = true;
        tex.anisotropy = maxAniso;
        return tex;
      }

      // -----------------------------------------------------------------------
      // 2. ULTRA-HD FRONT CARD TEXTURE (2048 x 3072) - USING me.png
      // -----------------------------------------------------------------------
            // Sourced directly from online CDN repository (Zero local image dependencies)
      const instaImg = new Image();
      instaImg.crossOrigin = 'anonymous';
      instaImg.src = 'https://raw.githubusercontent.com/tandpfun/skill-icons/main/icons/Instagram.svg';

      const linkedImg = new Image();
      linkedImg.crossOrigin = 'anonymous';
      linkedImg.src = 'https://raw.githubusercontent.com/tandpfun/skill-icons/main/icons/LinkedIn.svg';

      const gitImg = new Image();
      gitImg.crossOrigin = 'anonymous';
      gitImg.src = 'https://raw.githubusercontent.com/tandpfun/skill-icons/main/icons/Github-Dark.svg';

      function checkSocialLogos() {
        renderFrontFaceHD();
        frontTexture.needsUpdate = true;
      }
      instaImg.onload = checkSocialLogos;
      linkedImg.onload = checkSocialLogos;
      gitImg.onload = checkSocialLogos;

      // -----------------------------------------------------------------------
      // HELPER: DRAW CYBER TECH CORNERS
      // -----------------------------------------------------------------------
      function drawCyberCorners(ctx, w, h) {
        ctx.save();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';

        // Top-Left Cyber Corner Bracket
        ctx.beginPath();
        ctx.moveTo(90, 360);
        ctx.lineTo(90, 240);
        ctx.lineTo(170, 160);
        ctx.lineTo(340, 160);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(120, 330);
        ctx.lineTo(120, 250);
        ctx.lineTo(185, 185);
        ctx.lineTo(310, 185);
        ctx.stroke();

        // Bottom-Right Cyber Corner Bracket
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(w - 90, h - 360);
        ctx.lineTo(w - 90, h - 240);
        ctx.lineTo(w - 170, h - 160);
        ctx.lineTo(w - 340, h - 160);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(w - 120, h - 330);
        ctx.lineTo(w - 120, h - 250);
        ctx.lineTo(w - 185, h - 185);
        ctx.lineTo(w - 310, h - 185);
        ctx.stroke();

        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 2. ULTRA-HD FRONT CARD TEXTURE (2048 x 3072) - EXACT REFERENCE LAYOUT
      // -----------------------------------------------------------------------
      const frontCanvas = document.createElement('canvas');
      frontCanvas.width = isMobile ? 1024 : 2048;
      frontCanvas.height = isMobile ? 1536 : 3072;
      const frontCtx = frontCanvas.getContext('2d');
      if (isMobile) frontCtx.scale(0.5, 0.5);

      const frontTexture = new THREE.CanvasTexture(frontCanvas);
      frontTexture.generateMipmaps = false;
      frontTexture.minFilter = THREE.LinearFilter;
      frontTexture.magFilter = THREE.LinearFilter;
      frontTexture.anisotropy = maxAniso;

      let meImg = new Image();
      meImg.src = 'me.png';
      meImg.onload = () => {
        renderFrontFaceHD();
        frontTexture.needsUpdate = true;
      };

      function renderFrontFaceHD() {
        const w = 2048;
        const h = 3072;
        frontCtx.clearRect(0, 0, w, h);

        // Solid Matte Pitch Black Card Body
        frontCtx.fillStyle = '#08080a';
        frontCtx.fillRect(0, 0, w, h);

        const bgGrad = frontCtx.createLinearGradient(0, 0, w, h);
        bgGrad.addColorStop(0, '#0f0f13');
        bgGrad.addColorStop(0.45, '#070709');
        bgGrad.addColorStop(1, '#030305');
        frontCtx.fillStyle = bgGrad;
        frontCtx.fillRect(0, 0, w, h);

        // Precision card outer edge border with green glow
        frontCtx.save();
        frontCtx.strokeStyle = 'rgba(16, 185, 129, 0.45)';
        frontCtx.lineWidth = 10;
        frontCtx.beginPath();
        frontCtx.roundRect(14, 14, w - 28, h - 28, 48);
        frontCtx.stroke();
        frontCtx.restore();

        // Cyber Tech Corners
        drawCyberCorners(frontCtx, w, h);

        // Metallic Punch Hole Grommet Rim at top (for 3D lanyard rope hook)
        frontCtx.save();
        frontCtx.strokeStyle = '#334155';
        frontCtx.lineWidth = 14;
        frontCtx.beginPath();
        frontCtx.arc(w / 2, 130, 56, 0, Math.PI * 2);
        frontCtx.stroke();

        frontCtx.fillStyle = '#000000';
        frontCtx.beginPath();
        frontCtx.arc(w / 2, 130, 48, 0, Math.PI * 2);
        frontCtx.fill();
        frontCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        frontCtx.lineWidth = 4;
        frontCtx.stroke();
        frontCtx.restore();

        // Brand Header: POWERNEX 26 (Top-Left under punch hole)
        frontCtx.save();
        frontCtx.fillStyle = '#ffffff';
        frontCtx.font = 'bold 58px "Geist Mono", monospace';
        frontCtx.textAlign = 'left';
        frontCtx.letterSpacing = '3px';
        frontCtx.fillText('POWERNEX 26', 220, 275);

        // Accent green dot
        frontCtx.fillStyle = '#10b981';
        frontCtx.beginPath();
        frontCtx.arc(195, 256, 8, 0, Math.PI * 2);
        frontCtx.fill();
        frontCtx.restore();

        // PHOTO: me.png (Rounded rectangle framed with green border)
        const photoW = 1040;
        const photoH = 1180;
        const photoX = (w - photoW) / 2; // 504
        const photoY = 350;
        const photoRadius = 40;

        frontCtx.save();
        frontCtx.beginPath();
        frontCtx.roundRect(photoX, photoY, photoW, photoH, photoRadius);
        frontCtx.clip();

        if (meImg.complete && meImg.naturalWidth > 0) {
          frontCtx.imageSmoothingEnabled = true;
          frontCtx.imageSmoothingQuality = 'high';
          frontCtx.drawImage(
            meImg,
            0, 0, meImg.naturalWidth, meImg.naturalHeight,
            photoX, photoY, photoW, photoH
          );
        } else {
          frontCtx.fillStyle = '#1e1e24';
          frontCtx.fillRect(photoX, photoY, photoW, photoH);
        }
        frontCtx.restore();

        // Photo Outer Accent Green Border
        frontCtx.save();
        frontCtx.strokeStyle = '#10b981';
        frontCtx.lineWidth = 8;
        frontCtx.beginPath();
        frontCtx.roundRect(photoX, photoY, photoW, photoH, photoRadius);
        frontCtx.stroke();
        frontCtx.restore();

        // NAME: VEERAKUMAR V (Large Bold White)
        frontCtx.fillStyle = '#ffffff';
        frontCtx.font = 'bold 108px Inter, sans-serif';
        frontCtx.textAlign = 'center';
        frontCtx.letterSpacing = '1px';
        frontCtx.fillText('VEERAKUMAR V', w / 2, 1720);

        // TITLE: Web Developer & EEE Student
        frontCtx.fillStyle = '#cbd5e1';
        frontCtx.font = '600 62px Inter, sans-serif';
        frontCtx.textAlign = 'center';
        frontCtx.fillText('Web Developer & EEE Student', w / 2, 1830);

        // DEPARTMENT & INSTITUTION (with graduation cap icon)
        const capX = 260;
        const capY = 2060;
        const capSize = 46;

        frontCtx.save();
        frontCtx.strokeStyle = '#10b981';
        frontCtx.lineWidth = 5;
        frontCtx.lineCap = 'round';
        frontCtx.lineJoin = 'round';
        // Diamond
        frontCtx.beginPath();
        frontCtx.moveTo(capX, capY - capSize * 0.5);
        frontCtx.lineTo(capX + capSize, capY);
        frontCtx.lineTo(capX, capY + capSize * 0.5);
        frontCtx.lineTo(capX - capSize, capY);
        frontCtx.closePath();
        frontCtx.stroke();
        // Skull cap arc
        frontCtx.beginPath();
        frontCtx.arc(capX, capY + capSize * 0.2, capSize * 0.65, 0.2 * Math.PI, 0.8 * Math.PI);
        frontCtx.stroke();
        // Tassel
        frontCtx.beginPath();
        frontCtx.moveTo(capX + capSize * 0.7, capY + capSize * 0.15);
        frontCtx.lineTo(capX + capSize * 0.9, capY + capSize * 0.85);
        frontCtx.stroke();
        frontCtx.restore();

        frontCtx.save();
        frontCtx.textAlign = 'left';
        frontCtx.fillStyle = '#f8fafc';
        frontCtx.font = 'bold 54px Inter, sans-serif';
        frontCtx.fillText('Department of Electrical &', 350, 2030);
        frontCtx.fillText('Electronics Engineering', 350, 2100);

        frontCtx.fillStyle = '#94a3b8';
        frontCtx.font = '500 48px Inter, sans-serif';
        frontCtx.fillText('University College of Engineering,', 350, 2180);
        frontCtx.fillText('Ariyalur', 350, 2245);
        frontCtx.restore();

        // SOCIAL MEDIA ICONS ROW (Instagram, LinkedIn, GitHub)
        const socialY = 2550;
        const iconRadius = 82;
        const socials = [
          { name: 'Instagram', img: instaImg, x: 500, color: '#e1306c' },
          { name: 'LinkedIn', img: linkedImg, x: 1024, color: '#0a66c2' },
          { name: 'GitHub', img: gitImg, x: 1548, color: '#24292f' }
        ];

        socials.forEach(s => {
          // Circle background
          frontCtx.save();
          frontCtx.beginPath();
          frontCtx.arc(s.x, socialY, iconRadius, 0, Math.PI * 2);
          frontCtx.fillStyle = '#111116';
          frontCtx.fill();
          frontCtx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
          frontCtx.lineWidth = 4;
          frontCtx.stroke();
          frontCtx.clip();

          if (s.img && s.img.complete && s.img.naturalWidth > 0) {
            frontCtx.imageSmoothingEnabled = true;
            frontCtx.imageSmoothingQuality = 'high';
            frontCtx.drawImage(
              s.img,
              s.x - iconRadius + 8,
              socialY - iconRadius + 8,
              (iconRadius - 8) * 2,
              (iconRadius - 8) * 2
            );
          } else {
            frontCtx.fillStyle = s.color;
            frontCtx.fillRect(s.x - iconRadius, socialY - iconRadius, iconRadius * 2, iconRadius * 2);
          }
          frontCtx.restore();

          // Label
          frontCtx.save();
          frontCtx.fillStyle = '#cbd5e1';
          frontCtx.font = '600 48px Inter, sans-serif';
          frontCtx.textAlign = 'center';
          frontCtx.fillText(s.name, s.x, socialY + iconRadius + 75);
          frontCtx.restore();
        });
      }

      renderFrontFaceHD();

      // -----------------------------------------------------------------------
      // 3. ULTRA-HD BACK CARD TEXTURE (2048 x 3072) - EXACT REFERENCE LAYOUT
      // -----------------------------------------------------------------------
      const backCanvas = document.createElement('canvas');
      backCanvas.width = isMobile ? 1024 : 2048;
      backCanvas.height = isMobile ? 1536 : 3072;
      const backCtx = backCanvas.getContext('2d');
      if (isMobile) backCtx.scale(0.5, 0.5);

      const backTexture = new THREE.CanvasTexture(backCanvas);
      backTexture.generateMipmaps = false;
      backTexture.minFilter = THREE.LinearFilter;
      backTexture.magFilter = THREE.LinearFilter;
      backTexture.anisotropy = maxAniso;

      function renderBackFaceHD() {
        const w = 2048;
        const h = 3072;
        backCtx.clearRect(0, 0, w, h);

        // Pitch Black Base
        backCtx.fillStyle = '#08080a';
        backCtx.fillRect(0, 0, w, h);

        const bgGrad = backCtx.createLinearGradient(0, 0, w, h);
        bgGrad.addColorStop(0, '#0f0f13');
        bgGrad.addColorStop(0.45, '#070709');
        bgGrad.addColorStop(1, '#030305');
        backCtx.fillStyle = bgGrad;
        backCtx.fillRect(0, 0, w, h);

        // Outer green border
        backCtx.save();
        backCtx.strokeStyle = 'rgba(16, 185, 129, 0.45)';
        backCtx.lineWidth = 10;
        backCtx.beginPath();
        backCtx.roundRect(14, 14, w - 28, h - 28, 48);
        backCtx.stroke();
        backCtx.restore();

        // Cyber tech corners
        drawCyberCorners(backCtx, w, h);

        // Punch Hole Grommet Rim
        backCtx.save();
        backCtx.strokeStyle = '#334155';
        backCtx.lineWidth = 14;
        backCtx.beginPath();
        backCtx.arc(w / 2, 130, 56, 0, Math.PI * 2);
        backCtx.stroke();

        backCtx.fillStyle = '#000000';
        backCtx.beginPath();
        backCtx.arc(w / 2, 130, 48, 0, Math.PI * 2);
        backCtx.fill();
        backCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        backCtx.lineWidth = 4;
        backCtx.stroke();
        backCtx.restore();

        // -------------------------------------------------------------------
        // SECTION 1: ABOUT THE DEVELOPER
        // -------------------------------------------------------------------
        const sec1Y = 270;
        // User icon
        backCtx.save();
        backCtx.strokeStyle = '#10b981';
        backCtx.lineWidth = 5;
        backCtx.lineCap = 'round';
        backCtx.beginPath();
        backCtx.arc(220, sec1Y + 30, 24, 0, Math.PI * 2);
        backCtx.stroke();
        backCtx.beginPath();
        backCtx.arc(220, sec1Y + 95, 42, Math.PI * 1.15, Math.PI * 1.85);
        backCtx.stroke();
        backCtx.restore();

        // Header: ABOUT THE DEVELOPER
        backCtx.save();
        backCtx.font = 'bold 58px "Geist Mono", monospace';
        backCtx.textAlign = 'left';
        backCtx.fillStyle = '#ffffff';
        backCtx.fillText('ABOUT THE ', 300, sec1Y + 68);
        const aboutWidth = backCtx.measureText('ABOUT THE ').width;
        backCtx.fillStyle = '#10b981';
        backCtx.fillText('DEVELOPER', 300 + aboutWidth, sec1Y + 68);
        backCtx.restore();

        // Bio paragraph
        const bioText = "Veerakumar V is a second-year Electrical and Electronics Engineering student at University College of Engineering, Ariyalur, with an interest in software development, cybersecurity, UI/UX, and technology-driven projects.";
        backCtx.save();
        backCtx.fillStyle = '#cbd5e1';
        backCtx.font = '400 48px Inter, sans-serif';
        backCtx.textAlign = 'left';
        
        let words = bioText.split(' ');
        let line = '';
        let lineY = sec1Y + 165;
        const maxTextW = 1680;
        const lineH = 74;

        for (let n = 0; n < words.length; n++) {
          let testLine = line + words[n] + ' ';
          let metrics = backCtx.measureText(testLine);
          if (metrics.width > maxTextW && n > 0) {
            backCtx.fillText(line.trim(), 180, lineY);
            line = words[n] + ' ';
            lineY += lineH;
          } else {
            line = testLine;
          }
        }
        backCtx.fillText(line.trim(), 180, lineY);
        backCtx.restore();

        // Divider 1
        const div1Y = 740;
        backCtx.save();
        backCtx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        backCtx.lineWidth = 3;
        backCtx.beginPath();
        backCtx.moveTo(180, div1Y);
        backCtx.lineTo(w - 180, div1Y);
        backCtx.stroke();
        backCtx.restore();

        // -------------------------------------------------------------------
        // SECTION 2: TECHNICAL INTERESTS
        // -------------------------------------------------------------------
        const sec2Y = 830;
        // Code symbol </ >
        backCtx.save();
        backCtx.strokeStyle = '#10b981';
        backCtx.lineWidth = 5;
        backCtx.lineCap = 'round';
        backCtx.lineJoin = 'round';
        backCtx.beginPath();
        backCtx.moveTo(205, sec2Y + 18);
        backCtx.lineTo(185, sec2Y + 42);
        backCtx.lineTo(205, sec2Y + 66);
        backCtx.moveTo(245, sec2Y + 18);
        backCtx.lineTo(265, sec2Y + 42);
        backCtx.lineTo(245, sec2Y + 66);
        backCtx.moveTo(235, sec2Y + 12);
        backCtx.lineTo(215, sec2Y + 72);
        backCtx.stroke();
        backCtx.restore();

        // Header: TECHNICAL INTERESTS
        backCtx.save();
        backCtx.font = 'bold 58px "Geist Mono", monospace';
        backCtx.textAlign = 'left';
        backCtx.fillStyle = '#ffffff';
        backCtx.fillText('TECHNICAL ', 300, sec2Y + 54);
        const techWidth = backCtx.measureText('TECHNICAL ').width;
        backCtx.fillStyle = '#10b981';
        backCtx.fillText('INTERESTS', 300 + techWidth, sec2Y + 54);
        backCtx.restore();

        // Skills Pills Helper
        function drawSkillPill(text, x, y, pw) {
          const ph = 96;
          backCtx.save();
          backCtx.fillStyle = 'rgba(255, 255, 255, 0.05)';
          backCtx.strokeStyle = 'rgba(255, 255, 255, 0.20)';
          backCtx.lineWidth = 3;
          backCtx.beginPath();
          backCtx.roundRect(x, y, pw, ph, ph / 2);
          backCtx.fill();
          backCtx.stroke();

          backCtx.fillStyle = '#f8fafc';
          backCtx.font = '600 42px Inter, sans-serif';
          backCtx.textAlign = 'center';
          backCtx.fillText(text, x + pw / 2, y + 62);
          backCtx.restore();
        }

        // Row 1
        drawSkillPill('Web Development', 180, 950, 480);
        drawSkillPill('C / C++', 690, 950, 260);
        drawSkillPill('Python', 980, 950, 260);

        // Row 2
        drawSkillPill('Git & GitHub', 180, 1080, 380);
        drawSkillPill('UI/UX Design', 590, 1080, 380);
        drawSkillPill('Software Testing', 1000, 1080, 460);

        // Row 3
        drawSkillPill('Debugging', 180, 1210, 320);
        drawSkillPill('Cybersecurity & Ethical Hacking', 530, 1210, 800);

        // Row 4
        drawSkillPill('Electronics & Embedded Systems', 180, 1340, 780);

        // Divider 2
        const div2Y = 1520;
        backCtx.save();
        backCtx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        backCtx.lineWidth = 3;
        backCtx.beginPath();
        backCtx.moveTo(180, div2Y);
        backCtx.lineTo(w - 180, div2Y);
        backCtx.stroke();
        backCtx.restore();

        // -------------------------------------------------------------------
        // SECTION 3: POWERNEX 26
        // -------------------------------------------------------------------
        const sec3Y = 1600;
        // Monitor icon
        backCtx.save();
        backCtx.strokeStyle = '#10b981';
        backCtx.lineWidth = 5;
        backCtx.lineCap = 'round';
        backCtx.lineJoin = 'round';
        backCtx.strokeRect(185, sec3Y + 12, 68, 48);
        backCtx.beginPath();
        backCtx.moveTo(219, sec3Y + 60);
        backCtx.lineTo(219, sec3Y + 76);
        backCtx.moveTo(200, sec3Y + 76);
        backCtx.lineTo(238, sec3Y + 76);
        backCtx.stroke();
        backCtx.restore();

        // Header: POWERNEX 26
        backCtx.save();
        backCtx.font = 'bold 58px "Geist Mono", monospace';
        backCtx.textAlign = 'left';
        backCtx.fillStyle = '#ffffff';
        backCtx.fillText('POWERNEX 26', 300, sec3Y + 54);
        backCtx.restore();

        // Subheader: Role: Website Developer
        backCtx.save();
        backCtx.font = 'bold 50px Inter, sans-serif';
        backCtx.textAlign = 'left';
        backCtx.fillStyle = '#ffffff';
        backCtx.fillText('Role: ', 180, sec3Y + 140);
        const roleWidth = backCtx.measureText('Role: ').width;
        backCtx.fillStyle = '#10b981';
        backCtx.fillText('Website Developer', 180 + roleWidth, sec3Y + 140);
        backCtx.restore();

        // Role description
        const roleDesc = "Designed and developed the POWERNEX 26 symposium website, including its event information, registration interface, schedules, rulebook, and interactive UI.";
        backCtx.save();
        backCtx.fillStyle = '#94a3b8';
        backCtx.font = '400 46px Inter, sans-serif';
        backCtx.textAlign = 'left';
        
        words = roleDesc.split(' ');
        line = '';
        lineY = sec3Y + 225;

        for (let n = 0; n < words.length; n++) {
          let testLine = line + words[n] + ' ';
          let metrics = backCtx.measureText(testLine);
          if (metrics.width > maxTextW && n > 0) {
            backCtx.fillText(line.trim(), 180, lineY);
            line = words[n] + ' ';
            lineY += lineH;
          } else {
            line = testLine;
          }
        }
        backCtx.fillText(line.trim(), 180, lineY);
        backCtx.restore();

        // -------------------------------------------------------------------
        // BOTTOM MOTTO: Build / Learn / Grow
        // -------------------------------------------------------------------
        backCtx.save();
        backCtx.font = 'italic 58px "Plus Jakarta Sans", cursive, sans-serif';
        backCtx.fillStyle = '#10b981';
        backCtx.textAlign = 'center';
        backCtx.letterSpacing = '8px';
        backCtx.fillText('Build    /    Learn    /    Grow', w / 2, 2720);
        backCtx.restore();
      }

      renderBackFaceHD();

      // Card Mesh & Materials
      const edgeMaterial = new THREE.MeshStandardMaterial({
        color: 0x18181f,
        metalness: 0.8,
        roughness: 0.3
      });

      const frontMaterial = new THREE.MeshStandardMaterial({
        map: frontTexture,
        roughness: 0.45,
        metalness: 0.05
      });

      const backMaterial = new THREE.MeshStandardMaterial({
        map: backTexture,
        roughness: 0.45,
        metalness: 0.05
      });

      const materials = [
        edgeMaterial,
        edgeMaterial,
        edgeMaterial,
        edgeMaterial,
        frontMaterial,
        backMaterial
      ];

      const cardGeo = new THREE.BoxGeometry(CARD_WIDTH, CARD_HEIGHT, CARD_THICKNESS);
      const cardMesh = new THREE.Mesh(cardGeo, materials);

      const cardPivot = new THREE.Group();
      cardMesh.position.y = -CARD_HEIGHT / 2 - 0.25;
      cardPivot.add(cardMesh);

      // -----------------------------------------------------------------------
      // 4. REALISTIC GUNMETAL HARDWARE ASSEMBLY
      // -----------------------------------------------------------------------
      const metalMaterial = new THREE.MeshStandardMaterial({
        color: 0x222226,
        metalness: 0.85,
        roughness: 0.3
      });

      const hardwareGroup = new THREE.Group();

      // A. Bottom Ribbon Clamp Bar
      const clampGeo = new THREE.BoxGeometry(0.34, 0.08, 0.05);
      const clampMesh = new THREE.Mesh(clampGeo, metalMaterial);
      hardwareGroup.add(clampMesh);

      const crimpGeo = new THREE.BoxGeometry(0.35, 0.015, 0.055);
      const crimpMesh = new THREE.Mesh(crimpGeo, metalMaterial);
      hardwareGroup.add(crimpMesh);

      // B. Ring Connector
      const ringGeo = new THREE.TorusGeometry(0.085, 0.02, 16, 32);
      const ringMesh = new THREE.Mesh(ringGeo, metalMaterial);
      ringMesh.position.set(0, -0.07, 0);
      ringMesh.rotation.x = Math.PI / 2;
      hardwareGroup.add(ringMesh);

      // C. Swivel Collar
      const swivelGeo = new THREE.CylinderGeometry(0.04, 0.045, 0.08, 20);
      const swivelMesh = new THREE.Mesh(swivelGeo, metalMaterial);
      swivelMesh.position.set(0, -0.15, 0);
      hardwareGroup.add(swivelMesh);

      const swivelBeadGeo = new THREE.SphereGeometry(0.042, 16, 16);
      const swivelBead = new THREE.Mesh(swivelBeadGeo, metalMaterial);
      swivelBead.position.set(0, -0.11, 0);
      hardwareGroup.add(swivelBead);

      // D. Lobster Claw Body & Trigger
      const hookBodyGeo = new THREE.CylinderGeometry(0.028, 0.028, 0.13, 16);
      const hookBody = new THREE.Mesh(hookBodyGeo, metalMaterial);
      hookBody.position.set(0, -0.23, 0);
      hardwareGroup.add(hookBody);

      const triggerGeo = new THREE.BoxGeometry(0.02, 0.04, 0.03);
      const trigger = new THREE.Mesh(triggerGeo, metalMaterial);
      trigger.position.set(0.035, -0.22, 0);
      hardwareGroup.add(trigger);

      // E. Curved Lobster Hook Beak (Physically loops through card punch hole)
      const hookCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, -0.27, 0),
        new THREE.Vector3(-0.015, -0.34, 0.035),
        new THREE.Vector3(0, -0.40, 0.025),
        new THREE.Vector3(0.015, -0.42, 0.0),
        new THREE.Vector3(0.01, -0.41, -0.028),
        new THREE.Vector3(0, -0.34, -0.045),
        new THREE.Vector3(-0.01, -0.29, -0.025)
      ]);
      const hookBeakGeo = new THREE.TubeGeometry(hookCurve, 32, 0.017, 12, false);
      const hookBeak = new THREE.Mesh(hookBeakGeo, metalMaterial);
      hardwareGroup.add(hookBeak);

      cardPivot.add(hardwareGroup);
      scene.add(cardPivot);

      // -----------------------------------------------------------------------
      // 5. RESPONSIVE LANYARD RIBBON & VERLET PHYSICS
      // -----------------------------------------------------------------------
      const strapTex = createHDStrapTexture();
      const ROPE_SEGMENTS = 12;
      const RIBBON_WIDTH = 0.28;

      let TOTAL_ROPE_LENGTH = 1.6;
      let ROPE_TOP = new THREE.Vector3(0, 3.2, 0);

      const ropePoints = [];
      const oldRopePoints = [];

      function setupRopeNodes() {
        const isMobile = window.innerWidth < 640;
        TOTAL_ROPE_LENGTH = isMobile ? 1.2 : 1.7;
        ROPE_TOP.set(0, isMobile ? 2.75 : 3.3, 0);

        ropePoints.length = 0;
        oldRopePoints.length = 0;
        for (let i = 0; i <= ROPE_SEGMENTS; i++) {
          const t = i / ROPE_SEGMENTS;
          const p = new THREE.Vector3(0, ROPE_TOP.y - t * TOTAL_ROPE_LENGTH, 0);
          ropePoints.push(p);
          oldRopePoints.push(p.clone());
        }
      }

      setupRopeNodes();

      const ribbonGeo = new THREE.BufferGeometry();
      const vertexCount = (ROPE_SEGMENTS + 1) * 2;
      const positions = new Float32Array(vertexCount * 3);
      const uvs = new Float32Array(vertexCount * 2);
      const indices = [];

      for (let i = 0; i < ROPE_SEGMENTS; i++) {
        const a = i * 2;
        const b = i * 2 + 1;
        const c = (i + 1) * 2;
        const d = (i + 1) * 2 + 1;
        indices.push(a, b, c);
        indices.push(b, d, c);
      }

      ribbonGeo.setIndex(indices);
      ribbonGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      ribbonGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

      for (let i = 0; i <= ROPE_SEGMENTS; i++) {
        const v = 1.0 - (i / ROPE_SEGMENTS);
        uvs[i * 4 + 0] = 0.0;
        uvs[i * 4 + 1] = v;
        uvs[i * 4 + 2] = 1.0;
        uvs[i * 4 + 3] = v;
      }
      ribbonGeo.attributes.uv.needsUpdate = true;

      const ribbonMat = new THREE.MeshStandardMaterial({
        map: strapTex,
        roughness: 0.85,
        metalness: 0.05,
        side: THREE.DoubleSide
      });
      const ribbonMesh = new THREE.Mesh(ribbonGeo, ribbonMat);
      scene.add(ribbonMesh);

      function updateRibbonGeometry() {
        const posAttr = ribbonGeo.attributes.position;
        const halfW = RIBBON_WIDTH / 2;

        for (let i = 0; i <= ROPE_SEGMENTS; i++) {
          const pt = ropePoints[i];
          let tangent = new THREE.Vector3(0, -1, 0);
          if (i < ROPE_SEGMENTS) {
            tangent.subVectors(ropePoints[i + 1], pt).normalize();
          } else {
            tangent.subVectors(pt, ropePoints[i - 1]).normalize();
          }

          const lateral = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 0, 1)).normalize().multiplyScalar(halfW);
          if (lateral.lengthSq() < 0.0001) lateral.set(halfW, 0, 0);

          posAttr.setXYZ(i * 2 + 0, pt.x - lateral.x, pt.y - lateral.y, pt.z - lateral.z);
          posAttr.setXYZ(i * 2 + 1, pt.x + lateral.x, pt.y + lateral.y, pt.z + lateral.z);
        }
        posAttr.needsUpdate = true;
        ribbonGeo.computeVertexNormals();
      }

      // -----------------------------------------------------------------------
      // 6. ROCK-SOLID FLIP CONTROLLER & TOUCH/CLICK INTERACTIONS
      // -----------------------------------------------------------------------
      let isFlipped = false;
      let targetRotationY = 0;
      let currentRotationY = 0;

      const flipToggleBtn = document.getElementById('card-flip-toggle-btn');
      const flipBtnText = document.getElementById('flip-btn-text');

      function performFlipToggle() {
        isFlipped = !isFlipped;
        targetRotationY = isFlipped ? Math.PI : 0;
        if (flipBtnText) {
          flipBtnText.textContent = isFlipped ? 'SHOW FRONT' : 'FLIP CARD';
        }
      }

      if (flipToggleBtn) {
        flipToggleBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          performFlipToggle();
        });
      }

            function getClickedLink(hitPoint) {
        const local = cardMesh.worldToLocal(hitPoint.clone());
        const normY = (1.825 - local.y) / 3.65;
        const normX = (local.x + 1.2) / 2.4;

        // Front Face Social Buttons Row (normY between 0.78 and 0.92)
        if (!isFlipped && normY >= 0.78 && normY <= 0.94) {
          if (normX >= 0.14 && normX <= 0.34) {
            return 'https://instagram.com/mr_veerakumar.v';
          }
          if (normX >= 0.40 && normX <= 0.60) {
            return 'https://www.linkedin.com/in/v-veerakumar/';
          }
          if (normX >= 0.66 && normX <= 0.86) {
            return 'https://github.com/veerakumar-v';
          }
        }

        return null;
      }

      let isDragging = false;
      let dragStartPos = { x: 0, y: 0 };
      const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const planeIntersect = new THREE.Vector3();

      canvas.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button') || e.target.closest('a')) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        dragStartPos = { x: e.clientX, y: e.clientY };

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(cardMesh);
        if (intersects.length > 0) {
          isDragging = true;
          canvas.classList.add('grabbing');
          if (canvas.setPointerCapture) {
            canvas.setPointerCapture(e.pointerId);
          }
          dragPlane.setFromNormalAndCoplanarPoint(
            camera.getWorldDirection(new THREE.Vector3()).negate(),
            cardPivot.position
          );
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        if (isDragging) {
          raycaster.setFromCamera(mouse, camera);
          if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
            const endNode = ropePoints[ROPE_SEGMENTS];
            endNode.x += (planeIntersect.x - endNode.x) * 0.35;
            endNode.y += (planeIntersect.y - endNode.y) * 0.35;
            endNode.z += (planeIntersect.z - endNode.z) * 0.35;
          }
        } else if (isFlipped) {
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObject(cardMesh);
          if (intersects.length > 0) {
            const link = getClickedLink(intersects[0].point);
            if (link) {
              canvas.classList.add('link-hover');
            } else {
              canvas.classList.remove('link-hover');
            }
          } else {
            canvas.classList.remove('link-hover');
          }
        } else {
          canvas.classList.remove('link-hover');
        }
      });

      function handlePointerUpOrCancel(e) {
        if (!isDragging) return;
        isDragging = false;
        canvas.classList.remove('grabbing');
        if (canvas.releasePointerCapture) {
          try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        }

        const distMoved = Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y);

        // Generous tap distance threshold for capacitive touchscreens
        if (distMoved < 18) {
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObject(cardMesh);
          if (intersects.length > 0) {
            const link = getClickedLink(intersects[0].point);
            if (link) {
              if (link.startsWith('mailto:')) {
                window.location.href = link;
              } else {
                window.open(link, '_blank');
              }
            } else {
              performFlipToggle();
            }
          }
        }
      }

      canvas.addEventListener('pointerup', handlePointerUpOrCancel);
      canvas.addEventListener('pointercancel', handlePointerUpOrCancel);
      window.addEventListener('pointerup', handlePointerUpOrCancel);
      window.addEventListener('pointercancel', handlePointerUpOrCancel);

      // -----------------------------------------------------------------------
      // 7. RESPONSIVE VIEWPORT & CAMERA CALCULATION
      // -----------------------------------------------------------------------
      function updateViewportFraming() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const aspect = width / height;

        camera.aspect = aspect;

        if (aspect < 0.72) {
          camera.fov = 37;
          camera.position.set(0, -0.65, 8.4);
        } else if (aspect < 1.0) {
          camera.fov = 35;
          camera.position.set(0, -0.45, 8.5);
        } else {
          camera.fov = 33;
          camera.position.set(0, -0.32, 8.6);
        }

        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      }

      window.addEventListener('resize', () => {
        updateViewportFraming();
        setupRopeNodes();
      });

      updateViewportFraming();

      // -----------------------------------------------------------------------
      // 8. LUXURIOUS SMOOTH, SLOW RENDER & PHYSICS LOOP
      // -----------------------------------------------------------------------
      const gravity = new THREE.Vector3(0, -0.012, 0);
      const segmentLen = TOTAL_ROPE_LENGTH / ROPE_SEGMENTS;

      function animate() {
        requestAnimationFrame(animate);

        for (let i = 1; i <= ROPE_SEGMENTS; i++) {
          if (i === ROPE_SEGMENTS && isDragging) continue;

          const p = ropePoints[i];
          const oldP = oldRopePoints[i];
          const vx = (p.x - oldP.x) * 0.96;
          const vy = (p.y - oldP.y) * 0.96;
          const vz = (p.z - oldP.z) * 0.96;

          oldP.copy(p);

          p.x += vx + gravity.x;
          p.y += vy + gravity.y;
          p.z += vz + gravity.z;
        }

        ropePoints[0].copy(ROPE_TOP);

        const physicsPasses = isMobile ? 4 : 7;
        for (let pass = 0; pass < physicsPasses; pass++) {
          for (let i = 0; i < ROPE_SEGMENTS; i++) {
            const p1 = ropePoints[i];
            const p2 = ropePoints[i + 1];

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dz = p2.z - p1.z;
            const dist = Math.hypot(dx, dy, dz) || 0.001;
            const diff = (dist - segmentLen) / dist;

            if (i === 0) {
              p2.x -= dx * diff;
              p2.y -= dy * diff;
              p2.z -= dz * diff;
            } else if (i + 1 === ROPE_SEGMENTS && isDragging) {
              p1.x += dx * diff;
              p1.y += dy * diff;
              p1.z += dz * diff;
            } else {
              p1.x += dx * diff * 0.5;
              p1.y += dy * diff * 0.5;
              p1.z += dz * diff * 0.5;
              p2.x -= dx * diff * 0.5;
              p2.y -= dy * diff * 0.5;
              p2.z -= dz * diff * 0.5;
            }
          }
        }

        updateRibbonGeometry();

        const ropeTip = ropePoints[ROPE_SEGMENTS];
        const ropePreTip = ropePoints[ROPE_SEGMENTS - 1];
        cardPivot.position.copy(ropeTip);

        const ropeDir = new THREE.Vector3().subVectors(ropeTip, ropePreTip).normalize();
        const targetRotZ = THREE.MathUtils.clamp(-ropeDir.x * 0.65, -0.5, 0.5);
        const targetRotX = THREE.MathUtils.clamp(ropeDir.z * 0.65, -0.4, 0.4);

        cardPivot.rotation.z += (targetRotZ - cardPivot.rotation.z) * 0.08;
        cardPivot.rotation.x += (targetRotX - cardPivot.rotation.x) * 0.08;

        currentRotationY += (targetRotationY - currentRotationY) * 0.045;
        cardMesh.rotation.y = currentRotationY;

        renderer.render(scene, camera);
      }

      animate();
    })();
  </script>
